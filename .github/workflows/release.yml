name: Release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, 1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be a numeric version such as 1.0.0" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check manifest version
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          manifest_version="$(node -p 'require("./manifest.json").version')"
          if [[ "$manifest_version" != "$RELEASE_TAG" ]]; then
            echo "manifest.json version $manifest_version does not match tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check JavaScript syntax
        run: node --check content.js && node --check popup.js && node --check tests/content.test.cjs

      - name: Run JavaScript tests
        run: node --test tests/content.test.cjs

      - name: Validate and build extension package
        run: make package

      - name: Check ZIP integrity
        run: unzip -t dist/inaccurate-piano-midi-*.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/inaccurate-piano-midi-$RELEASE_TAG.zip" \
            --verify-tag \
            --generate-notes
